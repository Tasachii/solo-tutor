name: Scheduled quality checks
on:
  schedule:
    - cron: '20 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  dependencies-and-browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
        env:
          SOLO_CROSS_BROWSER: '1'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: แจ้งเตือนเมื่อล้ม (GitHub Issue ป้าย ops-alert)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONS_ALERT_WEBHOOK: ${{ secrets.OPERATIONS_ALERT_WEBHOOK }}
        run: node scripts/ops-alert.mjs quality
