# Backup ฐานข้อมูลบนแพลนฟรี (Supabase ฟรีไม่มี backup ให้) — dump ทุกสัปดาห์ เข้ารหัส แล้วเก็บเป็น artifact 90 วัน
# ต้องมี 2 secrets: SUPABASE_ACCESS_TOKEN (สร้างที่ supabase.com/dashboard/account/tokens) และ BACKUP_PASSPHRASE
# repo เป็นสาธารณะ ใครล็อกอิน GitHub ก็โหลด artifact ได้ จึงเข้ารหัสเสมอ ไม่มีข้อยกเว้น
# ซ้อม restore แล้ว 8 ก.ย. 2569: schema+data ลง Postgres 16 ได้ครบ 14 ตาราง
name: Weekly database backup
on:
  schedule:
    - cron: '35 20 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      PROJECT_REF: qbuafdbmpkffzbkqoysb
    steps:
      - name: ตรวจว่ามี secrets ครบ
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::ยังไม่ได้ตั้ง secret SUPABASE_ACCESS_TOKEN — gh secret set SUPABASE_ACCESS_TOKEN"; exit 1; }
          test "${#BACKUP_PASSPHRASE}" -ge 24 || { echo "::error::BACKUP_PASSPHRASE ต้องยาวอย่างน้อย 24 ตัว — gh secret set BACKUP_PASSPHRASE"; exit 1; }
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: dump schema + data ผ่าน login role (ไม่ต้องรหัสฐานข้อมูล)
        run: |
          echo "" | supabase link --project-ref "$PROJECT_REF"
          mkdir -p dump
          supabase db dump --linked -f dump/schema.sql
          supabase db dump --linked --data-only -f dump/data.sql
          ls -la dump
      - name: เข้ารหัสก่อนออกจาก runner
        run: |
          stamp=$(date -u +%Y%m%d-%H%M)
          tar -czf - dump | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -out "solo-tutor-db-$stamp.tar.gz.enc"
          rm -rf dump
          ls -la *.enc
          echo "ถอดรหัส: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass pass:<passphrase> -in FILE | tar -xzf -"
      - uses: actions/upload-artifact@v7
        with:
          name: solo-tutor-db-backup
          path: '*.tar.gz.enc'
          retention-days: 90
          if-no-files-found: error
