# รายงานสถานะระบบและตัวเลขการใช้งาน — **กดเองเท่านั้น** อ่านอย่างเดียว
#
# ตอบสองคำถามที่ต้องเปิดฐานถึงจะรู้ และไม่มีทางรู้จากในเครื่อง:
#   1) LINE OA ผูกถึงขั้นไหนแล้ว เหลือขั้นตอนไหนที่ต้องใช้มือคน
#   2) ตัวเลขการใช้งานจริงสำหรับทีม (Assignment / พิทช์)
#
# **พิมพ์ออกมาเฉพาะจำนวนนับและค่าจริง/เท็จ** ไม่มี channel secret ไม่มี access token
# ไม่มีชื่อครู ชื่อเด็ก ยอดเงินรายคน หรือ LINE user id — repo เป็นสาธารณะ log ก็สาธารณะ
name: Ops and usage report
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: qbuafdbmpkffzbkqoysb
      POOLER_HOST: aws-0-ap-southeast-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v7
      - name: report
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::ยังไม่ได้ตั้ง secret SUPABASE_DB_PASSWORD"; exit 1; }
          ENC=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$ENC"
          DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@${POOLER_HOST}:5432/postgres?sslmode=require"
          echo "::add-mask::$DB_URL"
          sudo apt-get update -qq && sudo apt-get install --yes -qq postgresql-client
          PGOPTIONS='-c default_transaction_read_only=on' \
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/ops-report.sql
