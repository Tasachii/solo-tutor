# Gateway auth must allow LINE-signed webhooks and cron-secret requests to reach their handlers.
# Each handler then performs the verification documented below.
[functions.line-webhook]
verify_jwt = false

[functions.line-send]
verify_jwt = false

# Modern Supabase JWTs may use asymmetric keys the gateway cannot verify. The handler always
# resolves the bearer token with auth.getUser(), so invalid tokens still fail closed.
[functions.line-connect]
verify_jwt = false

# Auth ที่ push ขึ้นโปรเจกต์จริงด้วย `supabase config push` — ประกาศเฉพาะที่ตั้งใจ ค่าที่ไม่ประกาศจะไม่ถูกแตะ
[auth]
site_url = "https://tasachii.github.io/solo-tutor/"
additional_redirect_urls = ["https://tasachii.github.io/solo-tutor/*"]

[auth.email]
enable_signup = true
# อีเมลในตัวของ Supabase ส่งได้ 2 ฉบับ/ชม. — เปิดยืนยันไว้ = ครูคนที่ 3 สมัครไม่ได้
# เปิดกลับเมื่อต่อ SMTP จริงแล้ว (เฟส 3 ในแผน)
enable_confirmations = false

# สองตัวนี้รับจากคนที่ยังไม่มีบัญชี (จองสิทธิ์ · รายงาน error) — CORS จำกัด origin ใน handler แล้ว
[functions.waitlist]
verify_jwt = false

[functions.report-error]
verify_jwt = false

[functions.usage]
verify_jwt = false
